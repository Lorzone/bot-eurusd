name: bot-eurusd
on:
  schedule:
    - cron: "3 * * * 0-5"   # ogni ora, 3 minuti dopo la chiusura della candela (dom-ven, UTC)
  workflow_dispatch: {}      # pulsante "Run workflow" per farlo girare a mano
permissions:
  contents: write
concurrency:
  group: bot-eurusd
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Esegui il bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: python run_bots.py
      - name: Salva stato e storico
        run: |
          git config user.name "eurusd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A bots DASHBOARD.md news_cache.json telegram_chat.txt 2>/dev/null || git add -A bots DASHBOARD.md
          if git diff --cached --quiet; then echo "niente da salvare"; exit 0; fi
          git commit -m "bot: aggiornamento $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
